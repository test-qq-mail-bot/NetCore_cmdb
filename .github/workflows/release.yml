name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(sed -n 's/.*"version"\s*:\s*"\([^"]*\)".*/\1/p' cmdb/plugin.py | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 cmdb/plugin.py 中解析版本号"
            exit 1
          fi
          echo "从 cmdb/plugin.py 解析到版本号: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package plugin
        if: steps.check.outputs.skip == 'false'
        run: |
          zip -r "cmdb-${{ steps.version.outputs.version }}.zip" cmdb \
            -x "cmdb/data/*" "cmdb/__pycache__/*"

      - name: Create Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: cmdb-${{ steps.version.outputs.version }}.zip
